name: SYBIL contract verification
on:
  push:
    branches: [main, 'work/sybil-contract-durable-state']
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Python contract tests and doctor
        run: |
          set -o pipefail
          python -m pip install -e .
          python -m unittest discover -s tests -v 2>&1 | tee python-contract.log
          python -m basil doctor 2>&1 | tee doctor-contract.log
          python scripts/verify_sybil_exchange.py --prepare
      - name: Android contract tests and debug build
        run: |
          set -o pipefail
          gradle -p clients/android/v0.1/source testDebugUnitTest assembleDebug --console=plain 2>&1 | tee android-contract.log
      - name: Cross-language semantic proof
        run: |
          set -o pipefail
          python scripts/verify_sybil_exchange.py 2>&1 | tee sybil-proof.log
      - name: Publish inspectable execution evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = ['python-contract.log', 'doctor-contract.log', 'android-contract.log', 'sybil-proof.log'].map(name => name + '\n' + (fs.existsSync(name) ? fs.readFileSync(name, 'utf8') : 'Step did not run.')).join('\n\n');
            const tests = 'clients/android/v0.1/source/app/build/test-results/testDebugUnitTest';
            if (fs.existsSync(tests)) summary += '\nAndroid JUnit reports:\n' + fs.readdirSync(tests).filter(name => name.endsWith('.xml')).map(name => fs.readFileSync(tests + '/' + name, 'utf8')).join('\n');
            await github.rest.checks.create({
              ...context.repo, name: 'SYBIL contract execution evidence', head_sha: context.sha,
              status: 'completed', conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: {title: 'Implementation HEAD contract tests and interoperability', summary: summary.slice(-60000)}
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sybil-contract-evidence
          path: |
            *-contract.log
            sybil-proof.log
            clients/android/v0.1/source/app/build/sybil-proof/
            clients/android/v0.1/source/app/build/test-results/testDebugUnitTest/
