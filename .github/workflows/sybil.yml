name: SYBIL contract verification
on:
  push:
    branches: ['work/sybil-contract-durable-state']
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  android-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac7c8e178ff5d81c2ea6610051b99b2a1747eeb8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Baseline Android tests and debug build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p clients/android/v0.1/source testDebugUnitTest assembleDebug --console=plain 2>&1 | tee android-baseline.log
      - name: Publish baseline evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('android-baseline.log') ? fs.readFileSync('android-baseline.log', 'utf8') : 'Build step did not start.';
            await github.rest.checks.create({
              ...context.repo, name: 'SYBIL baseline Android evidence',
              head_sha: context.sha, status: 'completed',
              conclusion: '${{ steps.build.outcome }}' === 'success' ? 'success' : 'neutral',
              output: {title: 'Unmodified audit baseline Android checks', summary: output.slice(-55000)}
            });
