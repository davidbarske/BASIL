name: SYBIL contract verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Python contract tests and doctor
        run: |
          set -o pipefail
          python -m pip install -e .
          python -m unittest discover -s tests -v 2>&1 | tee python-contract.log
          python -m basil doctor 2>&1 | tee doctor-contract.log
          python scripts/verify_sybil_exchange.py --prepare
      - name: Android contract tests and debug build
        run: |
          set -o pipefail
          gradle -p clients/android/v0.1/source testDebugUnitTest assembleDebug --console=plain 2>&1 | tee android-contract.log
      - name: Cross-language semantic proof
        run: |
          set -o pipefail
          python scripts/verify_sybil_exchange.py 2>&1 | tee sybil-proof.log
      - name: Preserve execution evidence in the existing job summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              for name in ("python-contract.log", "doctor-contract.log", "android-contract.log", "sybil-proof.log"):
                  path = Path(name)
                  text = path.read_text(encoding="utf-8") if path.exists() else "Step did not run."
                  summary.write(f"### {name}\n\n```text\n{text[-12000:]}\n```\n\n")
              totals = dict(tests=0, failures=0, errors=0, skipped=0)
              for path in Path("clients/android/v0.1/source/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
                  suite = ElementTree.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(suite.get(key, "0"))
              evidence = "Android JUnit totals: " + ", ".join(f"{key}={value}" for key, value in totals.items())
              print(evidence)
              summary.write(evidence + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sybil-contract-evidence
          path: |
            *-contract.log
            sybil-proof.log
            clients/android/v0.1/source/app/build/sybil-proof/
            clients/android/v0.1/source/app/build/test-results/testDebugUnitTest/
