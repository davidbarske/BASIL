<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="BASIL Importance by Urgency matrix">
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:34px;font-weight:700}.axis{font-size:22px;font-weight:700}.cell{font-size:21px;font-weight:700}.sub{font-size:16px}.n{font-size:34px;font-weight:800}
</style>
<rect width="1200" height="760" fill="#f5f4ef"/>
<text x="600" y="55" text-anchor="middle" class="title">BASIL | IMPORTANCE × URGENCY</text>
<text x="625" y="105" text-anchor="middle" class="axis">URGENCY</text>
<text x="220" y="145" text-anchor="middle" class="axis">IMMEDIATE</text>
<text x="570" y="145" text-anchor="middle" class="axis">PRESSING</text>
<text x="920" y="145" text-anchor="middle" class="axis">PENDING</text>
<text transform="translate(45 440) rotate(-90)" text-anchor="middle" class="axis">IMPORTANCE</text>
<g stroke="#222" stroke-width="2" fill="none">
<rect x="80" y="170" width="1050" height="510"/><line x1="430" y1="170" x2="430" y2="680"/><line x1="780" y1="170" x2="780" y2="680"/><line x1="80" y1="340" x2="1130" y2="340"/><line x1="80" y1="510" x2="1130" y2="510"/>
</g>
<g>
<text x="100" y="210" class="axis">CRITICAL</text><text x="100" y="235" class="sub">9–10</text>
<text x="100" y="380" class="axis">IMPORTANT</text><text x="100" y="405" class="sub">6–8</text>
<text x="100" y="550" class="axis">RELEVANT</text><text x="100" y="575" class="sub">1–5</text>
</g>
<g text-anchor="middle">
<text x="305" y="280" class="n">1</text><text x="605" y="280" class="n">2</text><text x="955" y="280" class="n">5</text>
<text x="305" y="450" class="n">3</text><text x="605" y="450" class="n">4</text><text x="955" y="450" class="n">7</text>
<text x="305" y="620" class="n">6</text><text x="605" y="620" class="n">8</text><text x="955" y="620" class="n">9</text>
</g>
<text x="600" y="725" text-anchor="middle" class="sub">Priority is the matrix position. Importance and Urgency remain separate facts.</text>
</svg>
